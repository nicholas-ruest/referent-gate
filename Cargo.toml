[package]
name = "referent-gate"
version = "0.1.0"
edition = "2024"
description = "Fail-closed referential ambiguity checks for agent actions"
license = "MIT"
repository = "https://github.com/nicholas-ruest/referent-gate"
readme = "README.md"
keywords = ["agents", "ambiguity", "cli", "safety"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
